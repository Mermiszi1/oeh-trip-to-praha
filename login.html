<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ÖH Prague Trip · Log in</title>
<meta name="theme-color" content="#1E2C66">
<meta name="apple-mobile-web-app-title" content="ÖH Prague">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--navy:#1E2C66;--yel:#F5C800;--bg:#F6F7FB;--surface:#fff;--ink:#161B2E;--muted:#5A6378;--line:#E1E5EF;--head:#1E2C66;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1530;--surface:#18214A;--ink:#EEF1F8;--muted:#A9B2CC;--line:#2A3566;--head:#E6EAF4}}
:root[data-theme="dark"]{--bg:#0F1530;--surface:#18214A;--ink:#EEF1F8;--muted:#A9B2CC;--line:#2A3566;--head:#E6EAF4}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy) url(/img/hero-sm.jpg) center/cover no-repeat;color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:20px}
body::before{content:"";position:fixed;inset:0;background:rgba(20,30,74,.72)}
.card{position:relative;width:100%;max-width:400px;background:var(--surface);border-radius:22px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{align-self:center;background:#fff;border-radius:999px;padding:8px 16px}
.logo img{width:150px;height:auto;display:block}
h1{margin:6px 0 0 0;font-size:24px;line-height:1.2;color:var(--head);text-align:center}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.5;text-align:center}
label.lab{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
input[type=password],input[type=text]{width:100%;min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;padding:0 16px;font-family:inherit}
input:focus{outline:none;border-color:var(--navy)}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:15px;color:var(--muted)}
.chk input{width:22px;height:22px}
button{min-height:54px;border-radius:14px;border:0;background:var(--yel);color:#1E2C66;font-weight:800;font-size:17px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button[disabled]{opacity:.6}
.err{min-height:1.4em;color:#B42318;font-weight:700;font-size:15px;text-align:center}
.small{font-size:13px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on" novalidate>
<span class="logo"><img src="/img/logo.png" alt="ÖH IMC Krems Students' Union"></span>
<h1 id="title">Prague Trip · 10–11 Oct</h1>
<p id="sub">Enter the trip password you got from the ÖH team.</p>
<label class="lab" for="pw">PASSWORD</label>
<input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
<label class="chk"><input type="checkbox" id="show"> Show password</label>
<button type="submit" id="go">Open the trip guide</button>
<div class="err" id="err" role="alert"></div>
<p class="small">You stay logged in on this device for 30 days. Questions? Contact Mercedesz or Patrycja.</p>
</form>
<script>
(function(){
  var q=new URLSearchParams(location.search), next=q.get('next')||'/', admin=q.get('admin')==='1';
  if(!/^\/[^/]/.test(next)&&next!=='/')next='/';
  if(admin){document.getElementById('title').textContent='Organiser login';document.getElementById('sub').textContent='For Mercedesz and Patrycja. Enter the admin password.';document.getElementById('go').textContent='Open organiser tools';}
  document.getElementById('show').addEventListener('change',function(){document.getElementById('pw').type=this.checked?'text':'password';});
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();var pw=document.getElementById('pw').value.trim(),btn=document.getElementById('go'),err=document.getElementById('err');
    if(!pw){err.textContent='Please enter the password.';return;}
    btn.disabled=true;err.textContent='';
    fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw}),credentials:'same-origin'})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(x){
        if(!x.ok){err.textContent='Wrong password. Please try again.';btn.disabled=false;return;}
        try{localStorage.setItem('oeh-role',x.j.role);}catch(e){}
        if(admin&&x.j.role!=='admin'){err.textContent='This password opens the trip guide, not the organiser tools.';btn.disabled=false;setTimeout(function(){location.replace('/');},1500);return;}
        location.replace(next);
      }).catch(function(){err.textContent='No internet connection. Connect once to log in.';btn.disabled=false;});
  });
  setTimeout(function(){document.getElementById('pw').focus();},100);
})();
</script>
</body>
</html>
